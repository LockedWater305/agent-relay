<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BeeZilla — Sketch</title>
<link rel="stylesheet" href="/buzzy/nav.css" />
<style>
  :root { --bz-bg:#0d0d0d; --bz-card:#151515; --bz-line:#242424; --bz-yellow:#ffd40d;
          --bz-text:#f2f2f2; --bz-muted:#8d8d8d; --bz-good:#6ee7a8; --bz-bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bz-bg); color:var(--bz-text); height:100vh; display:flex; flex-direction:column;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; overflow:hidden; }
  header { padding: 0.7rem 1rem 0.4rem; border-bottom: 1px solid var(--bz-line); }
  #bzNav { display:flex; flex-wrap:wrap; gap:0.9rem; padding-bottom:0.5rem; }
  #bzNav a { color:var(--bz-muted); text-decoration:none; font-size:0.84rem; }
  #bzNav a[data-nav="sketch"] { color: var(--bz-yellow); }
  .row { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
  .title { font-weight:600; font-size:0.95rem; margin-right:auto; }
  input[type="text"] { background:#101010; border:1px solid var(--bz-line); color:var(--bz-text);
                       border-radius:8px; padding:0.35rem 0.55rem; font-size:0.86rem; }
  button { background:#1b1b1b; color:var(--bz-text); border:1px solid var(--bz-line); border-radius:8px;
           padding:0.35rem 0.65rem; font-size:0.82rem; cursor:pointer; }
  button:hover { border-color:#3a3a3a; }
  button.on { background:var(--bz-yellow); color:#111; border-color:var(--bz-yellow); font-weight:600; }
  button.primary { background:var(--bz-yellow); color:#111; font-weight:600; border-color:var(--bz-yellow); }
  button:disabled { opacity:0.5; cursor:default; }
  #stage { position:relative; flex:1; overflow:hidden; background:#141414; }
  /* nav.js moves body's children into #bzPage on the first soft hop, so #stage stops
     being a flex item of body and `flex:1` resolves against an auto-height block:
     the canvas collapsed to its content height (~83px) while a hard load looked fine.
     This rule travels with this page's stylesheet, which the shell enables only while
     Sketch is the active page. */
  #bzPage { display:flex; flex-direction:column; flex:1 1 auto; min-height:0; }
  #board { position:absolute; inset:0; width:100%; height:100%; z-index:1; touch-action:none; }
  /* Marks sit above reference images, but only capture pointers in drawing tools. */
  #stage[data-sketch-tool="select"] #board { pointer-events:none; }
  #layers { position:absolute; inset:0; pointer-events:none; }
  .img-wrap { position:absolute; pointer-events:auto; cursor:move; touch-action:none; border:1px solid transparent; }
  .img-wrap.selected { border-color: var(--bz-yellow); }
  .img-wrap img { width:100%; height:100%; object-fit:fill; display:block; user-select:none; -webkit-user-drag:none; }
  .img-wrap .handle { position:absolute; right:-6px; bottom:-6px; width:12px; height:12px; background:var(--bz-yellow);
                      border-radius:2px; cursor:nwse-resize; pointer-events:auto; }
  /* The selected grip floats over overlapping references without reordering
     the picture itself. Drawing tools still give the canvas the whole board. */
  #stage[data-sketch-tool="select"] .img-wrap.selected .handle { z-index:2; }
  footer { border-top:1px solid var(--bz-line); padding:0.6rem 1rem; display:flex; flex-wrap:wrap; gap:0.6rem; align-items:center; }
  #prompt { flex:1 1 13rem; min-width:0; }
  @media (max-width:40rem) {
    #prompt, #status { flex:1 1 100%; }
  }
  #status { color:var(--bz-muted); font-size:0.8rem; }
  /* The closing brace used to sit at the end of the first declaration, so every rule
     after it (`position:absolute; … display:none`) was dropped: the panel rendered on
     every visit, over the canvas, with no render behind it. */
  #result { position:absolute; z-index:2; right:12px; top:12px; width:210px; max-width:calc(100% - 24px); max-height:calc(100% - 24px);
            overflow:auto; overscroll-behavior:contain; background:var(--bz-card); border:1px solid var(--bz-line);
            border-radius:12px; padding:0.6rem; display:none; }
  #result img { width:100%; border-radius:8px; display:block; }
  #result a { color:var(--bz-yellow); font-size:0.8rem; text-decoration:none; display:inline-block; margin-top:0.4rem; }
  #result img[hidden], #result a[hidden], #regionPanel[hidden] { display:none; }
  .hint { color:var(--bz-muted); font-size:0.78rem; }
  .drop { outline:2px dashed var(--bz-yellow); outline-offset:-8px; }

  #regionOverlay { position: absolute; inset: 0; cursor: crosshair; display: none; touch-action: none; }
  #regionOverlay.on { display: block; }
  #regionRect { position: absolute; pointer-events:none; border: 2px dashed #ffd40d; background: rgba(255,212,13,0.16); display: none; }
  #regionPanel { display: flex; gap: 0.45rem; align-items: center; margin-top: 0.5rem; flex-wrap: wrap; }
  #regionPanel input { flex:1 1 100%; min-width:0; max-width:100%; }
</style>
</head>
<body>
<header>
  <nav id="bzNav">
    <a href="/buzzy/talk" data-nav="talk">Talk</a>
    <a href="/buzzy/sketch" data-nav="sketch">Sketch</a>
    <a href="/buzzy/studio" data-nav="studio">Studio</a>
    <a href="/buzzy/library" data-nav="library">Library</a>
    <a href="/buzzy/capabilities" data-nav="capabilities">Capabilities</a>
    <a href="/buzzy/memory" data-nav="memory">Memory</a>
    <a href="/buzzy/experts" data-nav="experts">Experts</a>
    <a href="/buzzy/recipes" data-nav="recipes">Recipes</a>
    <a href="/buzzy/wallet" data-nav="wallet">Honey Drops</a>
    <a href="/buzzy/upload" data-nav="publish">Publish</a>
  </nav>
  <div class="row">
    <span class="title" id="pTitle">Untitled board</span>
    <button data-tool="select" class="on" aria-pressed="true">Select</button>
    <button data-tool="pen" aria-pressed="false">Brush</button>
    <button data-tool="line" aria-pressed="false">Line</button>
    <button data-tool="arrow" aria-pressed="false">Arrow</button>
    <button data-tool="rect" aria-pressed="false">Box</button>
    <button data-tool="text" aria-pressed="false">Note</button>
    <input id="color" type="color" value="#ffd40d" title="Colour" style="width:34px;height:30px;background:none;border:1px solid var(--bz-line);border-radius:8px" />
    <button id="undo" title="Undo (Ctrl/Cmd+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
    <button id="clear">Clear drawing</button>
    <button id="save">Save</button>
    <span id="savedFlag" role="status" style="font-size:.76rem;align-self:center"></span>
    <button id="shot" title="Download a PNG of the board">Export PNG</button>
    <button id="svg" title="Download the drawing as vector SVG (images are not included)">Export SVG</button>
  </div>
</header>

<div id="stage" data-sketch-tool="select">
  <canvas id="board"></canvas>
  <div id="layers"></div>
  <div id="result">
    <span class="hint" id="resultStatus" role="status"></span>
    <img id="resultImg" alt="Latest rendered image" hidden />
    <!-- Region edit: drag a box on the picture, say what should change inside it.
         The mask is drawn here, at the picture's own size, so the server never has
         to guess which pixels the owner meant. -->
    <div id="regionOverlay" title="Drag to mark the area to change"><div id="regionRect"></div></div>
    <div id="regionPanel" hidden>
      <input id="regionPrompt" type="text" aria-label="Describe what to change inside the box" placeholder="What should change inside the box? e.g. 'make the coat red'" />
      <button class="primary" id="regionApply">Change this area</button>
      <span class="hint" id="regionStatus" role="status">Drag a box on the picture, then describe the change.</span>
    </div>
    <a id="resultLink" download aria-label="Download latest rendered image" hidden>Download</a>
  </div>
</div>

<footer>
  <input id="prompt" type="text" aria-label="Describe what to create" placeholder="Describe what to create — e.g. 'a red car driving along the road I drew, evening light'" />
  <label class="hint" style="display:flex;align-items:center;gap:0.35rem" title="Send the last rendered picture as the reference instead of the board">
    <input type="checkbox" id="iterate" /> Iterate from last render
  </label>
  <button class="primary" id="create">Create</button>
  <span id="status" role="status">Drop or paste images, draw between them, then Create.</span>
</footer>

<script>
  // The board is an ordered set of things the owner placed: images they dropped,
  // strokes they drew, and notes. "Create" flattens the whole thing into one
  // reference image and asks the model to produce the result — so connecting a car
  // to a road IS the instruction, not a description of one.
  (function () {
    var jobId = new URLSearchParams(location.search).get("job");
    var initialJobId = jobId;
    var controls = {};
    Array.prototype.forEach.call((document.getElementById("bzPage") || document).querySelectorAll("[id]"), function (el) { controls[el.id] = el; });
    function $(id) { return controls[id]; }
    var stage = $("stage");
    var canvas = $("board");
    var layers = $("layers");
    var ctx = canvas.getContext("2d");
    var statusEl = $("status");
    var promptEl = $("prompt");
    var titleEl = $("pTitle");

    var tool = "select";
    var color = "#ffd40d";
    var strokes = [];        // {tool, color, width, points:[{x,y}] | x,y,w,h | text}
    var images = [];         // {id,url,x,y,w,h}
    var selected = null;
    // Undo is a stack of board snapshots, not a pile of per-tool inverses: strokes,
    // images and their positions are one document, so one snapshot restores all of it.
    var lastRenderUrl = null;   // the newest rendered picture on this board
    var undoStack = [];
    var redoStack = [];
    var hydrated = !jobId, loading = false, leaving = false, pageHidden = false;
    var createBusy = false, regionBusy = false, desktopLease = null;
    var revision = 0, savedRevision = 0, saveTimer = null, pendingSave = null;
    var toolButtons = Array.prototype.slice.call(document.querySelectorAll("button[data-tool]"));
    function ownsPage() { return stage.isConnected && document.getElementById("stage") === stage; }
    function currentPage() {
      var selectedJob = new URLSearchParams(location.search).get("job");
      return ownsPage() && !pageHidden && /^\/buzzy\/sketch(?:\.html)?\/?$/.test(location.pathname) &&
        (selectedJob === jobId || (!initialJobId && selectedJob === null));
    }
    function editable() { return hydrated && !leaving && !desktopLease && !window.__bzDesktopDocumentLease && currentPage(); }
    function enableControls() {
      var disabled = !hydrated || leaving || Boolean(desktopLease);
      toolButtons.forEach(function (el) { el.disabled = disabled; });
      ["undo", "redo", "clear", "shot", "svg"].forEach(function (id) { $(id).disabled = disabled; });
      $("create").disabled = disabled || createBusy;
      $("regionApply").disabled = disabled || regionBusy;
      $("save").disabled = loading || leaving || Boolean(desktopLease);
      $("save").textContent = hydrated ? "Save" : "Retry load";
    }
    function setSaved(text, ok) {
      if (!ownsPage()) return;
      var el = $("savedFlag");
      clearTimeout(el._t);
      el.textContent = text;
      el.style.color = ok ? "#6ee7a8" : "#ff6b6b";
      if (ok) el._t = setTimeout(function () {
        if (ownsPage() && revision === savedRevision) el.textContent = "";
      }, 2500);
    }
    function snapshotJson() { return serializeSnapshot(images); }
    function serializeSnapshot(imageRecords) {
      // Selection belongs to this exact ordered snapshot, not a reused live
      // array index or a legacy ID that another entry may share.
      return JSON.stringify({ strokes: strokes, images: imageRecords, selectedImage: images.indexOf(selected) });
    }
    function snapshot() { pushSnapshot(snapshotJson()); }
    function pushSnapshot(previous) {
      undoStack.push(previous);
      if (undoStack.length > 50) undoStack.shift();
      redoStack.length = 0;
    }
    function changed() {
      revision++;
      setSaved("Unsaved changes", false);
      autoSave();
    }
    function autoSave() {
      if (!hydrated || !ownsPage() || leaving) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () { flushSave(); }, 1200);
    }
    // One immutable snapshot per request. A response acknowledges only that
    // revision, never edits completed while the request was pending.
    function flushSave(keepalive) {
      clearTimeout(saveTimer);
      if (!hydrated || !ownsPage()) return Promise.resolve(false);
      if (pendingSave) return pendingSave.then(function (ok) { return ok ? flushSave(keepalive) : false; });
      if (savedRevision === revision) return Promise.resolve(true);
      var submittedRevision = revision, board = JSON.stringify(boardJson());
      setSaved("Saving…", false);
      pendingSave = ensureJob().then(function (id) {
        if (!ownsPage()) throw new Error("Board is no longer open.");
        var body = JSON.stringify({ action: "save", jobId: id, board: JSON.parse(board) });
        // Ordinary saves must not be subject to the browser's shared 64 KiB
        // keepalive budget. On exit, keep only eligible small uploads alive.
        return fetch("/api/buzzy/art", {
          method: "POST", credentials: "same-origin",
          keepalive: keepalive === true && typeof Blob === "function" && new Blob([body]).size <= 65536,
          headers: { "content-type": "application/json" },
          body: body,
        });
      }).then(function (r) {
        if (!r.ok) throw new Error("Save failed.");
        return r.json();
      }).then(function (d) {
        if (!d || d.ok !== true || d.saved !== true) throw new Error("Save was not confirmed.");
        savedRevision = submittedRevision;
        if (revision === savedRevision) setSaved("Saved to project", true);
        else setSaved("Unsaved changes", false);
        return true;
      }).catch(function () {
        setSaved("Not saved. Use Save to retry; keep this board open.", false);
        return false;
      }).then(function (ok) {
        pendingSave = null;
        if (ok && revision !== savedRevision && ownsPage()) return flushSave(keepalive);
        return ok;
      });
      return pendingSave;
    }
    // The shell drains this page before removing it. A failed save keeps its
    // draft mounted for retry; cancelling navigation releases the same owner.
    stage.setAttribute("data-bz-before-leave", "");
    stage.bzBeforeLeave = function () {
      if (desktopLease || window.__bzDesktopDocumentLease) return Promise.resolve(false);
      finishStroke();
      finishImageDrag();
      leaving = true;
      enableControls();
      clearTimeout(saveTimer);
      if (!hydrated || revision === savedRevision && !pendingSave) return Promise.resolve(true);
      return flushSave().then(function (ok) {
        if (!ok) setStatus("Could not save. Your changes are still here; use Save, then try leaving again.");
        return ok;
      });
    };
    stage.bzResume = function () { leaving = false; enableControls(); if (!desktopLease) resumeLoad(); };
    // Fixed desktop-only hook. Main captures this exact element/document and a
    // nonce; the shell cannot release a desktop lease or read arbitrary state.
    stage.bzDesktopSketch = Object.freeze({
      begin: function (nonce) {
        if (!currentPage() || desktopLease && desktopLease !== nonce) throw new Error("Sketch owner changed.");
        finishStroke(); finishImageDrag();
        desktopLease = nonce;
        clearTimeout(saveTimer); enableControls();
      },
      state: function (nonce) {
        if (desktopLease !== nonce || !currentPage()) throw new Error("Sketch owner changed.");
        return { lease: nonce, jobId: jobId, dirty: hydrated && (revision !== savedRevision || Boolean(pendingSave)) };
      },
      drain: function (nonce) {
        if (desktopLease !== nonce || !currentPage()) return Promise.reject(new Error("Sketch owner changed."));
        if (!hydrated) return Promise.resolve(true);
        return flushSave();
      },
      release: function (nonce) {
        if (desktopLease !== nonce) return;
        desktopLease = null; enableControls(); resumeLoad();
      },
    });
    window.addEventListener("pagehide", function () {
      finishStroke(); finishImageDrag();
      flushSave(true);
      pageHidden = true;
    });
    document.addEventListener("visibilitychange", function () { if (document.hidden) flushSave(true); });
    window.addEventListener("beforeunload", function (event) {
      if (ownsPage() && hydrated && (revision !== savedRevision || pendingSave)) {
        event.preventDefault(); event.returnValue = "";
      }
    });
    function resumeLoad() {
      if (!currentPage()) return;
      if (!hydrated) load();
      else if (revision !== savedRevision) autoSave();
    }
    window.addEventListener("pageshow", function () { pageHidden = false; resumeLoad(); });
    window.addEventListener("popstate", resumeLoad);
    function applySnapshot(json) {
      var d = JSON.parse(json);
      strokes = d.strokes || [];
      images = d.images || [];
      // Rebind only the selection captured with these records. Retire a drag
      // whose object belonged to the replaced snapshot.
      selected = Number.isInteger(d.selectedImage) && d.selectedImage >= 0 ? images[d.selectedImage] || null : null;
      drag = null;
      selectedStroke = null;
      renderImages();
      redraw();
    }
    function undo() {
      if (!editable()) return;
      // Do not remove earlier marks while a new shape is still being drawn.
      if (draft) { discardDraft(); setStatus("Draft canceled."); return; }
      if (!undoStack.length) { setStatus("Nothing to undo."); return; }
      redoStack.push(snapshotJson());
      applySnapshot(undoStack.pop());
      changed();
      setStatus("Undone.");
    }
    function redo() {
      if (!editable()) return;
      if (!redoStack.length) { setStatus("Nothing to redo."); return; }
      undoStack.push(snapshotJson());
      applySnapshot(redoStack.pop());
      changed();
      setStatus("Redone.");
    }
    var drag = null;
    var draft = null;
    var draftPointerId = null;
    var scale = 1;           // canvas pixels per CSS pixel

    function resize() {
      var r = stage.getBoundingClientRect();
      var dpr = window.devicePixelRatio || 1;
      // The canvas BOX is CSS-owned (explicit 100% width/height inside #stage).
      // A replaced canvas with auto dimensions uses its DPR-sized bitmap instead. Pinning
      // style.width/height from a rect measured at parse time froze the box at whatever
      // the stage measured before layout settled — 1034.6px against a 909.6px stage on a
      // soft hop (this page's scripts run before #bzPage's flex applies), 979px against
      // 910px on a hard load. #stage's overflow:hidden then clips the difference: the
      // drawing surface is silently bigger than the board, its bottom cannot be reached,
      // and the board's coordinate space depends on when the measurement ran (measure too
      // early in the other direction and you get a dead strip below the canvas, which is
      // BZ-26's collapse at its extreme). Only the backing store follows the measurement;
      // ResizeObserver re-measures once layout settles (see the listener at the bottom).
      var w = Math.max(1, Math.round(r.width * dpr));
      var h = Math.max(1, Math.round(r.height * dpr));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      scale = dpr;
      redraw();
    }

    function newId() { return "s_" + Math.random().toString(36).slice(2, 9); }

    // A note belongs to a mark, not to a coordinate: "this road is too narrow" must
    // stay attached to the road when the drawing around it moves. Anchor = stroke id;
    // the note's own x1/y1 is only a fallback for marks that no longer exist.
    function anchorPoint(id, marks) {
      var pool = marks || strokes;
      var st = null;
      for (var i = 0; i < pool.length; i++) if (pool[i].id === id) { st = pool[i]; break; }
      if (!st) return null;
      if (st.tool === "pen" && st.points && st.points.length) {
        var p = st.points[Math.floor(st.points.length / 2)];
        return { x: p.x, y: p.y - 12 };
      }
      if (st.tool === "text") return null;
      return { x: (st.x1 + st.x2) / 2, y: (st.y1 + st.y2) / 2 - 12 };
    }

    // Which mark is under the cursor? Cheap segment distance is enough for selecting.
    function hitTest(p, shapesOnly) {
      var best = null, bestD = 9;
      // The most recently drawn mark is painted on top. In a distance tie,
      // pick it rather than an otherwise invisible mark underneath.
      strokes.slice().reverse().forEach(function (st) {
        if (st.tool === "text") {
          if (shapesOnly) return;
          var at = (st.anchor && anchorPoint(st.anchor)) || { x: st.x1, y: st.y1 };
          ctx.save();
          ctx.font = "600 15px -apple-system, Segoe UI, Inter, sans-serif";
          var metrics = ctx.measureText(st.text || "");
          ctx.restore();
          var left = at.x - (st.anchor ? 9 : 2);
          if (p.x >= left && p.x <= at.x + metrics.width + 2 &&
              p.y >= at.y - Math.max(10, metrics.actualBoundingBoxAscent || 0) - 2 &&
              p.y <= at.y + Math.max(2, metrics.actualBoundingBoxDescent || 0) + 2 &&
              bestD > 0) { best = st; bestD = 0; }
          return;
        }
        if (st.tool === "pen" && st.points) {
          if (st.points.length === 1) {
            var dotDistance = segDist(p, st.points[0], st.points[0]);
            if (dotDistance < bestD) { bestD = dotDistance; best = st; }
          }
          for (var i = 1; i < st.points.length; i++) {
            var d = segDist(p, st.points[i - 1], st.points[i]);
            if (d < bestD) { bestD = d; best = st; }
          }
        } else {
          if (st.tool === "rect") {
            var corners = [[st.x1, st.y1, st.x2, st.y1], [st.x2, st.y1, st.x2, st.y2],
                           [st.x2, st.y2, st.x1, st.y2], [st.x1, st.y2, st.x1, st.y1]];
            corners.forEach(function (c) {
              var dd = segDist(p, { x: c[0], y: c[1] }, { x: c[2], y: c[3] });
              if (dd < bestD) { bestD = dd; best = st; }
            });
          } else {
            var d2 = segDist(p, { x: st.x1, y: st.y1 }, { x: st.x2, y: st.y2 });
            if (d2 < bestD) { bestD = d2; best = st; }
          }
        }
      });
      return best;
    }
    function segDist(p, a, b) {
      var vx = b.x - a.x, vy = b.y - a.y;
      var wx = p.x - a.x, wy = p.y - a.y;
      var len2 = vx * vx + vy * vy;
      var t = len2 ? Math.max(0, Math.min(1, (wx * vx + wy * vy) / len2)) : 0;
      var dx = p.x - (a.x + t * vx), dy = p.y - (a.y + t * vy);
      return Math.sqrt(dx * dx + dy * dy);
    }

    function redraw() {
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      strokes.forEach(function (s) { drawStroke(s, false); });
      if (draft) drawStroke(draft, true);
    }

    function drawStroke(s, isDraft, output, marks) {
      var c = output || ctx;
      // A legacy colorless mark keeps the original default ink; the picker
      // selects the next mark, not the color of saved geometry.
      var markColor = s.color || "#ffd40d";
      c.strokeStyle = markColor;
      c.fillStyle = markColor;
      c.lineWidth = s.width || 3;
      c.lineCap = "round";
      c.lineJoin = "round";
      c.setLineDash(isDraft ? [6, 4] : []);
      if (!output && s === selectedStroke) {
        c.lineWidth = (s.width || 3) + 6;
        c.strokeStyle = "rgba(255,212,13,0.25)";
        c.beginPath();
        if (s.tool === "pen" && s.points && s.points.length) { c.moveTo(s.points[0].x, s.points[0].y);
          for (var i = 1; i < s.points.length; i++) c.lineTo(s.points[i].x, s.points[i].y); }
        else if (s.tool === "rect") { c.rect(s.x1, s.y1, s.x2 - s.x1, s.y2 - s.y1); }
        else if (s.tool === "line" || s.tool === "arrow") { c.moveTo(s.x1, s.y1); c.lineTo(s.x2, s.y2); }
        c.stroke();
        c.lineWidth = s.width || 3;
        c.strokeStyle = markColor;
      }
      if (s.tool === "pen") {
        if (!s.points.length) return;
        // A tap is a saved brush mark even though it has no line segment.
        if (s.points.length === 1) {

    function pt(e) {

    // ── images: drop, paste, move, resize ─────────────────────────────
    function addImage(url, at) {

      images.push(item);
      renderImages();

    }
    function renderImages() {

        wrap.style.left = im.x + "px";
        wrap.style.top = im.y + "px";
        wrap.style.width = im.w + "px";
        wrap.style.height = im.h + "px";
        wrap.setAttribute("data-id", typeof im.id === "string" || typeof im.id === "number" ? im.id : "");
        var img = document.createElement("img");
        img.src = im.url;
        img.alt = "";

        handle.className = "handle";
        wrap.appendChild(img);
        wrap.appendChild(handle);
        wrap.addEventListener("pointerdown", function (e) {

    // ── flatten the board for the model ───────────────────────────────

    $("save").addEventListener("click", function () {

    // The drawing is already vectors — {tool, colour, width, points} — so an SVG

    $("create").addEventListener("click", function () {

      createBusy = true;
      btn.disabled = true;
      var iterate = $("iterate").checked && !!lastRenderUrl;
      setStatus(iterate ? "Creating — using the last render as the reference…" : "Creating — flattening the board…");
      (iterate ? toDataUrl(lastRenderUrl) : flatten()).then(function (composite) {
        setStatus("Creating — the model is working…");
        // Create is the other moment a board becomes a project: without an id the
        // render lands as an asset no job claims.
        return ensureJob().then(function (id) {
          var body = {
            action: "render",
            prompt: prompt + (iterate
              ? "\n\nThe attached image is the PREVIOUS render of this board. Change it as instructed and keep everything the instruction does not mention."
              : "\n\nThe attached image is the owner's board: placed images plus hand-drawn marks, arrows and notes showing what belongs where and how it moves. Honour the layout, the connections and the annotations."),
            refs: [composite],
            jobId: id,
          };
          return fetch("/api/buzzy/art", {
            method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" },
            body: JSON.stringify(body),
          }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); });
        });
      }).then(function (res) {
        createBusy = false;
        enableControls();
        if (!res.ok) {
          setStatus(res.status === 402 ? "Art is part of the paid plans — " + (res.d.error || "") : (res.d.error || "Could not create."));
          return;
        }
        var img = res.d.image;
        showResult(img.url);
        setStatus("Done in " + Math.round((res.d.ms || 0) / 100) / 10 + "s — added to the board and to the project.");
        addImage(img.url, { x: 60 + images.length * 18, y: 60 + images.length * 18 });
      }).catch(function (e) {
        createBusy = false;
        enableControls();
        setStatus("Failed: " + e.message);
      });
    });

    // ── region edit ───────────────────────────────────────────────────
    // A change to one part of a finished picture. The mask is a PNG at the picture's
    // natural size: black everywhere, white where the owner dragged. Sending the
    // picture + mask + instruction is what keeps the rest of the frame from being
    // re-rolled, which is the difference between an edit and a fresh guess.
    (function initRegionEdit() {
      var overlay = $("regionOverlay");
      var rectEl = $("regionRect");
      var img = $("resultImg");
      var box = $("result");
      var input = $("regionPrompt");
      var btn = $("regionApply");
      var note = $("regionStatus");
      var dragStart = null;
      var picked = null;  // normalized coordinates owned by one rendered image
      var previewUrl = null;

      function showRect(rect) {
        if (!rect) { rectEl.style.display = "none"; return; }
        rectEl.style.display = "block";
        rectEl.style.left = (100 * rect.x) + "%"; rectEl.style.top = (100 * rect.y) + "%";
        rectEl.style.width = (100 * rect.w) + "%"; rectEl.style.height = (100 * rect.h) + "%";
      }

      function syncOverlay() {
        if (!lastRenderUrl || !img.complete || !img.naturalWidth) { overlay.classList.remove("on"); return; }
        if (previewUrl !== lastRenderUrl) {
          dragStart = null;
          if (picked) note.textContent = "Drag a box on the new picture.";
          picked = null; showRect(null);
          previewUrl = lastRenderUrl;
        }
        var r = img.getBoundingClientRect();
        var b = box.getBoundingClientRect();
        overlay.style.left = (r.left - b.left - box.clientLeft + box.scrollLeft) + "px";
        overlay.style.top = (r.top - b.top - box.clientTop + box.scrollTop) + "px";
        overlay.style.width = r.width + "px";
        overlay.style.height = r.height + "px";
        overlay.classList.add("on");
      }

      function corner(e) {
        var r = overlay.getBoundingClientRect();
        return { x: Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)),
                 y: Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)) };
      }
      function regionTo(e) {
        var end = corner(e);
        return { x: Math.min(end.x, dragStart.x), y: Math.min(end.y, dragStart.y),
                 w: Math.abs(end.x - dragStart.x), h: Math.abs(end.y - dragStart.y), url: dragStart.url };
      }
      overlay.addEventListener("pointerdown", function (e) {
        if (!editable() || !primaryPointer(e) || regionBusy || previewUrl !== lastRenderUrl || !img.complete || !img.naturalWidth) return;
        overlay.setPointerCapture(e.pointerId);
        dragStart = corner(e);
        dragStart.id = e.pointerId; dragStart.url = lastRenderUrl;
        // Keep a committed area in reserve until its replacement is valid.
        // While dragging, no committed selection is available to Apply.
        dragStart.previous = picked;
        picked = null;
        showRect(regionTo(e));
        e.preventDefault();
      });
      overlay.addEventListener("pointermove", function (e) {
        if (dragStart && dragStart.id === e.pointerId && dragStart.url === lastRenderUrl) showRect(regionTo(e));
      });
      function restoreCrop(withPrevious, withoutPrevious) {
        var previous = dragStart.previous;
        picked = previous && previous.url === lastRenderUrl ? previous : null;
        dragStart = null;
        showRect(picked);
        note.textContent = picked ? withPrevious : withoutPrevious;
      }
      overlay.addEventListener("pointerup", function (e) {
        if (!dragStart || dragStart.id !== e.pointerId) return;
        var next = dragStart.url === lastRenderUrl ? regionTo(e) : null;
        var r = overlay.getBoundingClientRect();
        if (!next || next.w * r.width < 8 || next.h * r.height < 8) {
          restoreCrop("That box is too small. Previous area kept.", "That box is too small — drag a wider area.");
          return;
        }
        picked = next;
        dragStart = null;
        showRect(picked);
        note.textContent = Math.round(picked.w * r.width) + "×" + Math.round(picked.h * r.height) + " selected. Describe the change.";
        input.focus();
      });
      function cancelCrop(e) {
        if (!dragStart || dragStart.id !== e.pointerId) return;
        restoreCrop("Selection canceled. Previous area kept.", "Drag a box on the picture first.");
      }
      overlay.addEventListener("pointercancel", cancelCrop);
      overlay.addEventListener("lostpointercapture", cancelCrop);

      window.addEventListener("resize", syncOverlay);
      img.addEventListener("load", syncOverlay);

      function maskDataUrl() {
        var w = img.naturalWidth, h = img.naturalHeight;
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        var g = c.getContext("2d");
        g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
        g.fillStyle = "#fff";
        g.fillRect(picked.x * w, picked.y * h, picked.w * w, picked.h * h);
        return c.toDataURL("image/png");
      }

      btn.addEventListener("click", function () {
        if (!editable()) return;
        var instruction = (input.value || "").trim();
        if (!lastRenderUrl) { note.textContent = "Create a picture first, then change part of it."; return; }
        if (!picked || picked.url !== lastRenderUrl || !img.complete || !img.naturalWidth) {
          note.textContent = "Drag a box on the picture first."; return;
        }
        if (!instruction) { input.focus(); note.textContent = "Say what should change inside the box."; return; }
        var imageId = Number(String(lastRenderUrl).split("/").pop());
        regionBusy = true;
        btn.disabled = true;
        note.textContent = "Changing that area…";
        fetch("/api/buzzy/art", {
          method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" },
          body: JSON.stringify({ action: "edit", jobId: jobId || undefined, imageId: imageId, mask: maskDataUrl(), instruction: instruction }),
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); })
          .then(function (res) {
            regionBusy = false;
            enableControls();
            if (!res.ok) {
              note.textContent = res.status === 402 ? "Art is part of the paid plans — " + (res.d.error || "")
                : "Could not change it: " + (res.d.error || "unknown");
              return;
            }
            showResult(res.d.image.url);
            addImage(res.d.image.url, { x: 60 + images.length * 18, y: 60 + images.length * 18 });
            picked = null;
            rectEl.style.display = "none";
            note.textContent = "Changed in " + Math.round((res.d.ms || 0) / 100) / 10 + "s — saved to this project.";
            flushSave();
          })
          .catch(function (e) { regionBusy = false; enableControls(); note.textContent = "Failed: " + e.message; });
      });
    })();

    // ── load the saved board ──────────────────────────────────────────
    function validBoard(board) {
      if (board === null) return true; // owned project with no board yet
      if (!board || typeof board !== "object" || Array.isArray(board) ||
          (board.version !== undefined && board.version !== 1) || !Array.isArray(board.strokes) || !Array.isArray(board.images)) return false;
      function point(p) { return p && Number.isFinite(p.x) && Number.isFinite(p.y); }
      return board.strokes.every(function (s) {
        if (!s || typeof s !== "object" || Array.isArray(s)) return false;
        if (s.tool === "pen") return Array.isArray(s.points) && s.points.every(point);
        if (s.tool === "text") return Number.isFinite(s.x1) && Number.isFinite(s.y1) && (s.text === undefined || typeof s.text === "string");
        return ["line", "arrow", "rect"].indexOf(s.tool) >= 0 &&
          [s.x1, s.y1, s.x2, s.y2].every(Number.isFinite);
      }) && board.images.every(function (im) {
        return im && typeof im.url === "string" && [im.x, im.y, im.w, im.h].every(Number.isFinite);
      });
    }
    function load() {
      if (loading || hydrated || !currentPage()) { resize(); return; }
      var requestedJob = jobId;
      loading = true;
      enableControls();
      setStatus("Loading saved board…");
      fetch("/api/buzzy/art?job=" + encodeURIComponent(requestedJob), { credentials: "same-origin" })
        .then(function (r) {
          if (!r.ok) throw new Error("Could not load the board.");
          return r.json();
        }).then(function (d) {
          if (!currentPage() || requestedJob !== jobId) return;
          if (!d || d.ok !== true || !Object.prototype.hasOwnProperty.call(d, "board") || !validBoard(d.board) ||
              !Array.isArray(d.images) || !d.images.every(function (im) { return im && typeof im.url === "string"; })) throw new Error("Invalid board response.");
          strokes = d.board ? d.board.strokes : [];
          images = d.board ? d.board.images : [];
          if (d.images.length) showResult(d.images[d.images.length - 1].url);
          resize(); renderImages();
          hydrated = true;
          setStatus("Board loaded. Changes are saved to this project.");
          // Title is presentation only; it cannot authorize hydration or writing.
          fetch("/api/buzzy/projects/" + encodeURIComponent(requestedJob), { credentials: "same-origin" })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (p) {
              if (!currentPage() || requestedJob !== jobId) return;
              var t = p && p.project && typeof p.project.title === "string" ? p.project.title : "";
              if (t) { titleEl.textContent = t; document.title = t + " — BeeZilla Sketch"; }
            }).catch(function () {});
        }).catch(function () {
          if (currentPage()) setStatus("Could not load this board. Use Retry load before editing; the saved board has not been changed.");
        }).then(function () {
          loading = false;
          if (ownsPage()) enableControls();
        });
    }

    // A board with no project gets one when the owner first PUTS something on it —
    // never on page load. Opening Sketch used to POST a new job_art_… every time the
    // nav sent you here, so a lap of the site left a heap of empty "Sketch board"
    // projects (BZ-13, Nov 2026). One promise, so a burst of strokes still makes one.
    var jobPromise = null;
    function ensureJob() {
      if (!ownsPage() || !hydrated) return Promise.reject(new Error("Board is not ready."));
      if (jobId) {
        if (!initialJobId && currentPage()) history.replaceState({}, "", "/buzzy/sketch?job=" + encodeURIComponent(jobId));
        return Promise.resolve(jobId);
      }
      if (jobPromise) return jobPromise;
      var id = "job_art_" + Date.now().toString(36);
      // POST /api/buzzy/jobs is the upsert (a PUT to /jobs/<id> is a 404 — the
      // route does not exist, and a board with nowhere to land orphans its render).
      jobPromise = fetch("/api/buzzy/jobs", {
        method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" },
        body: JSON.stringify({ id: id, title: "Sketch board", status: "In progress", data: {} }),
      }).then(function (r) {
        if (!r.ok) throw new Error("could not open a board");
        var active = currentPage();
        jobId = id;
        if (active) history.replaceState({}, "", "/buzzy/sketch?job=" + encodeURIComponent(id));
        return id;
      }).catch(function (e) {
        // One failed attempt must not become one POST per brush stroke: retry on a
        // later mark, not on every mark.
        setTimeout(function () { jobPromise = null; }, 5000);
        throw e;
      });
      return jobPromise;
    }
    if (!jobId) titleEl.textContent = "New board";
    window.addEventListener("resize", resize);
    // A stage that changes size without a window resize (nav rows wrapping, fonts
    // landing, #bzPage gaining its flex on a soft hop) must re-measure the backing
    // store, or the canvas keeps the size it guessed at parse time.
    if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(stage);
    enableControls();
    load();
  })();
</script>
</body>
</html>
