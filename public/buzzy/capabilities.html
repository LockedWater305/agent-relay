<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BeeZilla — Capabilities</title>
<link rel="stylesheet" href="/buzzy/nav.css" />
<style>
  :root {
    --bz-bg: #0d0d0d;
    --bz-card: #151515;
    --bz-line: #242424;
    --bz-yellow: #ffd40d;
    --bz-text: #f2f2f2;
    --bz-muted: #8d8d8d;
    --bz-bad: #ff6b6b;
    --bz-good: #6ee7a8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bz-bg); color: var(--bz-text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    padding: 0 1.1rem 4rem;
  }
  header.top { max-width: 860px; margin: 0 auto; padding: 1.2rem 0 0.4rem; }
  #bzNav { display: flex; flex-wrap: wrap; gap: 0.9rem; padding: 0 0 1rem; }
  #bzNav a { color: var(--bz-muted); text-decoration: none; font-size: 0.86rem; }
  #bzNav a[aria-current="page"], #bzNav a[data-nav="capabilities"] { color: var(--bz-yellow); }
  h1 { font-size: 1.28rem; margin: 0.6rem 0 0.2rem; letter-spacing: -0.01em; }
  .sub { color: var(--bz-muted); font-size: 0.88rem; margin: 0 0 1.4rem; }
  main { max-width: 860px; margin: 0 auto; }
  .card {
    background: var(--bz-card); border: 1px solid var(--bz-line); border-radius: 14px;
    padding: 0.85rem 1rem; margin-bottom: 0.7rem; display: flex; gap: 0.8rem; align-items: flex-start;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 0.45rem; flex: 0 0 auto; }
  .ok .dot { background: var(--bz-good); }
  .no .dot { background: var(--bz-bad); }
  .card > div { min-width: 0; overflow-wrap: anywhere; }
  .cap-label { font-weight: 600; font-size: 0.95rem; }
  .cap-state { font-size: 0.8rem; font-weight: 600; }
  .ok .cap-state { color: var(--bz-good); }
  .no .cap-state { color: var(--bz-bad); }
  .cap-detail { color: var(--bz-muted); font-size: 0.83rem; margin-top: 0.15rem; font-variant-numeric: tabular-nums; }
  h2 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--bz-muted); margin: 1.7rem 0 0.6rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--bz-line); }
  th { color: var(--bz-muted); font-weight: 500; }
  td.num { font-variant-numeric: tabular-nums; color: var(--bz-muted); }
  th, td { overflow-wrap: anywhere; vertical-align: top; }
  @media (max-width: 38rem) {
    table { table-layout: fixed; }
    th, td { padding-inline: 0.25rem; }
  }
  #capsRetry {
    background: var(--bz-card); color: var(--bz-text); border: 1px solid var(--bz-muted);
    border-radius: 6px; padding: 0.35rem 0.8rem; font: inherit; cursor: pointer;
  }
  .stamp { color: var(--bz-muted); font-size: 0.75rem; margin-top: 1.4rem; }
  code { background: #1d1d1d; padding: 0.05rem 0.3rem; border-radius: 4px; font-size: 0.8rem; }
</style>
</head>
<body>
<header class="top">
  <nav id="bzNav">
    <a href="/buzzy/talk" data-nav="talk">Talk</a>
    <a href="/buzzy/sketch" data-nav="sketch">Sketch</a>
    <a href="/buzzy/studio" data-nav="studio">Studio</a>
    <a href="/buzzy/library" data-nav="library">Library</a>
    <a href="/buzzy/capabilities" data-nav="capabilities">Capabilities</a>
    <a href="/buzzy/memory" data-nav="memory">Memory</a>
    <a href="/buzzy/experts" data-nav="experts">Experts</a>
    <a href="/buzzy/recipes" data-nav="recipes">Recipes</a>
    <a href="/buzzy/wallet" data-nav="wallet">Honey Drops</a>
    <a href="/buzzy/upload" data-nav="publish">Publish</a>
    <a href="/buzzy/landing" class="account-link" id="accountLink">Sign in</a>
  </nav>
  <h1>What BeeZilla can do here</h1>
  <p class="sub">Status from the same registry the chat loop uses. Each card says whether a capability is configured on <em>this</em> deployment.</p>
</header>
<main>
  <div id="caps" tabindex="-1" aria-busy="true"><p class="sub" role="status">Loading…</p></div>
  <button id="capsRetry" type="button" hidden>Retry</button>
  <h2>Tools the model may call</h2>
  <div id="tools" aria-busy="true"><p class="sub" role="status">Loading…</p></div>
  <p class="stamp" id="stamp"></p>
</main>
<script>
  (function () {
    var capsEl = document.getElementById("caps");
    var toolsEl = document.getElementById("tools");
    var stampEl = document.getElementById("stamp");
    var retryEl = document.getElementById("capsRetry");
    var serial = 0;

    function esc(v) {
      return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
    }
    function message(el, text) {
      var line = document.createElement("p");
      line.className = "sub";
      line.setAttribute("role", "status");
      line.textContent = text;
      el.replaceChildren(line);
    }
    function owned() {
      return capsEl.isConnected && document.getElementById("caps") === capsEl &&
        document.getElementById("tools") === toolsEl && document.getElementById("stamp") === stampEl;
    }

    function loadCapabilities() {
      if (!owned()) return;
      var request = ++serial;
      var restoreFocus = document.activeElement === retryEl;
      function current() { return request === serial && owned(); }
      retryEl.hidden = true;
      stampEl.textContent = "";
      capsEl.setAttribute("aria-busy", "true");
      toolsEl.setAttribute("aria-busy", "true");
      message(capsEl, "Loading…");
      message(toolsEl, "Loading…");
      fetch("/api/buzzy/capabilities", { credentials: "same-origin" })
        .then(function (r) {
          if (!r.ok) throw new Error("Registry unavailable");
          return r.json();
        })
        .then(function (d) {
          if (!current()) return;
          if (!d || d.ok === false || !Array.isArray(d.capabilities) || !Array.isArray(d.tools)) {
            throw new Error("No registry data");
          }
          if (!d.capabilities.length) message(capsEl, "No capabilities were reported.");
          else capsEl.innerHTML = d.capabilities.map(function (c) {
            return '<div class="card ' + (c.ok ? "ok" : "no") + '">' +
              '<span class="dot" aria-hidden="true"></span>' +
              '<div><div class="cap-label">' + esc(c.label) + "</div>" +
              '<div class="cap-state">' + (c.ok ? "Configured here" : "Not configured here") + "</div>" +
              '<div class="cap-detail">' + esc(c.detail) + "</div></div></div>";
          }).join("");

          if (!d.tools.length) message(toolsEl, "No tools were reported.");
          else toolsEl.innerHTML =
            "<table><thead><tr><th scope='col'>tool</th><th scope='col'>gate</th><th scope='col'>cost</th><th scope='col'>budget</th><th scope='col'>state</th></tr></thead><tbody>" +
            d.tools.map(function (t) {
              return "<tr><td><code>" + esc(t.name) + "</code></td>" +
                "<td>" + esc(t.gate) + "</td>" +
                "<td>" + esc(t.cost) + "</td>" +
                '<td class="num">' + Math.round(t.timeoutMs / 1000) + "s</td>" +
                "<td>" + (t.offered ? "offered" : "withheld — " + esc(t.withheld)) + "</td></tr>";
            }).join("") + "</tbody></table>";

          stampEl.textContent = d.generatedAt ? "Generated " + d.generatedAt : "";
          if (restoreFocus && document.activeElement === document.body) capsEl.focus();
        })
        .catch(function () {
          if (!current()) return;
          message(capsEl, "Could not load capabilities.");
          message(toolsEl, "Could not load the tool list.");
          retryEl.hidden = false;
          if (restoreFocus && document.activeElement === document.body) retryEl.focus();
        })
        .finally(function () {
          if (!current()) return;
          capsEl.setAttribute("aria-busy", "false");
          toolsEl.setAttribute("aria-busy", "false");
        });
    }
    retryEl.addEventListener("click", loadCapabilities);
    loadCapabilities();
  })();
</script>
<script id="caps-account">
  /* Retired: the chrome owns identity now. This block used to replace the header's
   * "Sign in" with the signed-in name after /api/auth/get-session, but the chrome
   * paints the name from its cached identity first and this page's link is the
   * chrome's link — this script removed its href and set cursor:default, which
   * killed the link to /buzzy/profile. The served nav link ships EMPTY (a skeleton)
   * and nav.js paints it, so there is nothing left for this page to do. */
</script>
</body>
</html>
